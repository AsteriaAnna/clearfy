/* ---------------- 16. 悬浮窗拖动 / 底部拉伸（v0.5） ---------------- */
var wDrag = null;
var suppressWidgetClick = false;
function bindWidget(){
  var widget = $('#widget');
  widget.addEventListener('pointerdown', function(e){
    if (e.target.closest('.w-home') || e.target.closest('.w-seg') || e.target.closest('.w-row') ||
        e.target.closest('.w-create') || e.target.closest('.w-more')) return;
    var isHeight = !!e.target.closest('.w-resize');
    var base = widgetBase();
    var rect = widget.getBoundingClientRect();
    var sceneRect = $('#scene').getBoundingClientRect();
    wDrag = {
      mode: isHeight ? 'height' : 'move',
      startX: e.clientX, startY: e.clientY,
      left: rect.left - sceneRect.left, top: rect.top - sceneRect.top,
      w: rect.width, h: rect.height,
      sceneW: sceneRect.width, sceneH: sceneRect.height,
      row: base.row, startExtra: widgetExtra(), maxExtra: widgetMaxExtra(),
      pointerId: e.pointerId, moved: false
    };
    if (isHeight) {
      widget.style.left = wDrag.left + 'px';
      widget.style.top = wDrag.top + 'px';
      widget.style.right = 'auto';
      widget.style.bottom = 'auto';
    }
    widget.classList.add('dragging');
    document.body.classList.add('is-moving');
    try { widget.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  document.addEventListener('pointermove', function(e){
    if (!wDrag || e.pointerId !== wDrag.pointerId) return;
    var dx = e.clientX - wDrag.startX;
    var dy = e.clientY - wDrag.startY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) wDrag.moved = true;
    if (wDrag.mode === 'move') {
      var left = clamp(wDrag.left + dx, 8, Math.max(8, wDrag.sceneW - wDrag.w - 8));
      var top = clamp(wDrag.top + dy, 8, Math.max(8, wDrag.sceneH - wDrag.h - 8));
      widget.style.left = left + 'px';
      widget.style.top = top + 'px';
      widget.style.right = 'auto';
      widget.style.bottom = 'auto';
    } else {
      var steps = Math.round(dy / wDrag.row);
      var extra = clamp(wDrag.startExtra + steps, 0, wDrag.maxExtra);
      if (extra !== widgetExtra()) {
        setWidgetExtra(extra);
        renderWidget();
        var h = widget.offsetHeight;
        var top2 = clamp(wDrag.top, 8, Math.max(8, wDrag.sceneH - h - 8));
        widget.style.top = top2 + 'px';
        widget.style.left = wDrag.left + 'px';
      }
    }
  });
  document.addEventListener('pointerup', function(){
    if (!wDrag) return;
    suppressWidgetClick = wDrag.moved;
    if (suppressWidgetClick) setTimeout(function(){ suppressWidgetClick = false; }, 0);
    wDrag = null;
    widget.classList.remove('dragging');
    document.body.classList.remove('is-moving');
  });
}
/* ---------------- 17. 主题 / 性能 / 标注 / 状态 ---------------- */
function setTheme(theme){
  var changed = state.theme !== theme;
  state.theme = theme;
  var html = document.documentElement;
  if (changed) html.classList.add('theme-switching');
  html.setAttribute('data-theme', theme);
  updateThemeButtons();
  applyWidgetOpacity();
  if (state.settingsOpen && changed) renderView();
  if (changed) setTimeout(function(){ html.classList.remove('theme-switching'); }, 260);
}
function updateThemeButtons(){
  $$('[data-theme-set]').forEach(function(btn){
    var on = btn.getAttribute('data-theme-set') === state.theme;
    btn.classList.toggle('active', on);
    if (btn.classList.contains('theme-card')) btn.setAttribute('aria-pressed', String(on));
  });
}

function setDemoState(v){
  state.demoState = v;
  var sel = $('#stateSel');
  if (sel) sel.value = v;
  if ($('#captureLayer').classList.contains('show')) updateCapState();
  renderAll();
}
function syncDock(){
  var dock = $('#notesDock');
  dock.classList.toggle('collapsed', !state.dockOpen);
  var btn = $('#dockToggle');
  if (btn) btn.textContent = state.dockOpen ? '收起标注' : '展开标注';
  var annoBtn = $('#annoBtn');
  if (annoBtn) annoBtn.classList.toggle('on', state.anno);
}
function setAnno(on){
  state.anno = on;
  document.body.classList.toggle('anno-off', !on);
  if (on) state.dockOpen = true;
  syncDock();
}
function setDock(open){ state.dockOpen = open; syncDock(); }

/* ---------------- 18. 设置页 / 首页 ---------------- */
function openSettings(){
  closeDrawer();
  closeDayModal();
  closeRP();
  state.settingsOpen = true;
  $('#appwin').classList.add('settings-mode');
  $('#topbarMain').hidden = true;
  $('#topbarSettings').hidden = false;
  renderAll();
}
function closeSettings(){
  state.settingsOpen = false;
  $('#appwin').classList.remove('settings-mode');
  $('#topbarMain').hidden = false;
  $('#topbarSettings').hidden = true;
  renderAll();
}
function goHome(){
  if (state.settingsOpen) closeSettings();
  var w = $('#appwin');
  w.classList.remove('pulse');
  void w.offsetWidth;
  w.classList.add('pulse');
  setTimeout(function(){ w.classList.remove('pulse'); }, 900);
}

/* ---------------- 19. 总渲染 ---------------- */
function renderAll(){
  renderTopbar();
  renderView();
  renderDone();
  renderWidget();
}

/* ---------------- 20. 事件 ---------------- */
function onClick(e){
  var target = e.target;

  var tpl = target.closest('[data-template]');
  if (tpl) { state.template = tpl.getAttribute('data-template'); closeDrawer(); renderAll(); return; }
  var scale = target.closest('[data-scale]');
  if (scale) { state.scale = scale.getAttribute('data-scale'); renderAll(); return; }
  var scope = target.closest('[data-scope]');
  if (scope) { state.scope = scope.getAttribute('data-scope'); renderAll(); return; }
  var calnav = target.closest('[data-calnav]');
  if (calnav) { state.calOffset += parseInt(calnav.getAttribute('data-calnav'), 10); renderCalendar(); return; }
  if (target.closest('#settingsBtn')) { openSettings(); return; }
  if (target.closest('#backBtn')) { closeSettings(); return; }

  if (target.closest('#doneHead')) { state.doneOpen = !state.doneOpen; renderDone(); return; }
  var restore = target.closest('[data-restore]');
  if (restore) { restoreAnimated(restore); return; }

  var doneBtn = target.closest('[data-done]');
  if (doneBtn) {
    e.preventDefault();
    e.stopPropagation();
    completeTaskAnimated(doneBtn.getAttribute('data-done'), doneBtn.closest('.point-task,.block-task,.below-row,.b-row,.dm-row,.wk-point,.wk-block'));
    return;
  }

  var wAction = target.closest('[data-widget-action]');
  if (wAction) {
    var wAct = wAction.getAttribute('data-widget-action');
    if (wAct === 'capture') openCapture();
    else if (wAct === 'more') goTodayView();
    return;
  }

  var wtask = target.closest('[data-wtask]');
  if (wtask) {
    if (suppressWidgetClick) return;
    completeWidgetTask(wtask.getAttribute('data-wtask'), wtask);
    return;
  }

  var taskEl = target.closest('[data-task]');
  if (taskEl) {
    if (taskEl.closest('.day-modal')) closeDayModal();
    openDrawer(taskEl.getAttribute('data-task'));
    return;
  }

  var cell = target.closest('[data-date]');
  if (cell) { openDayModal(cell.getAttribute('data-date')); return; }

  if (target.closest('[data-home]')) { goHome(); return; }

  var wscope = target.closest('[data-wscope]');
  if (wscope) { state.widgetScope = wscope.getAttribute('data-wscope'); renderWidget(); return; }

  var wtpl = target.closest('[data-widget-template]');
  if (wtpl) { state.widgetTemplate = wtpl.getAttribute('data-widget-template'); setWidgetExtra(0); renderView(); renderWidget(); return; }
  var rangeBtn = target.closest('[data-range]');
  if (rangeBtn) { openRangePicker(rangeBtn.getAttribute('data-range')); return; }

  if (target.closest('[data-rp-cancel]')) { closeRP(); return; }
  if (target.closest('[data-rp-ok]')) { confirmRP(); return; }

  if (target.closest('[data-drawer-close]')) { closeDrawer(); return; }
  if (target.closest('#drawerScrim')) { closeDrawer(); return; }
  var chip = target.closest('[data-timemode]');
  if (chip) { setTimeMode(chip.getAttribute('data-timemode')); return; }
  if (target.closest('#deleteBtn')) {
    var del = $('#deleteBtn');
    if (del) del.style.display = 'none';
    var cf = $('#deleteConfirm');
    if (cf) cf.classList.add('show');
    return;
  }
  if (target.closest('#cancelDelete')) {
    var cf2 = $('#deleteConfirm');
    if (cf2) cf2.classList.remove('show');
    var del2 = $('#deleteBtn');
    if (del2) del2.style.display = '';
    return;
  }
  if (target.closest('#confirmDelete')) {
    var id = state.drawerTaskId;
    if (id) {
      state.tasks = state.tasks.filter(function(t){ return t.id !== id; });
      closeDrawer();
      renderAll();
      if (state.modalDate) refreshDayModal();
    }
    return;
  }

  if (target.closest('[data-daymodal-close]')) { closeDayModal(); return; }
  var modalBg = target.closest('#dayModalOverlay');
  if (modalBg && target === modalBg) { closeDayModal(); return; }

  if (target.closest('#captureBtn')) { openCapture(); return; }
  if (target.closest('#captureLayer') && !target.closest('.capture')) { closeCapture(); return; }

  var themePick = target.closest('[data-theme-set]');
  if (themePick) { setTheme(themePick.getAttribute('data-theme-set')); return; }
  if (target.closest('#annoBtn')) { setAnno(!state.anno); return; }
  if (target.closest('#dockToggle')) { setDock(!state.dockOpen); return; }
  if (target.closest('#resetBtn')) { resetDemo(); return; }
}

function onChange(e){
  var el = e.target;
  if (el.id === 'stateSel') { setDemoState(el.value); return; }
  if (el.id === 'drawerTitle') {
    var t = taskById(state.drawerTaskId);
    if (t) {
      var v = (el.value || '').trim();
      if (v) t.title = v;
      renderView();
      renderWidget();
    }
    return;
  }
  if (el.id === 'drawerDate') {
    var t2 = taskById(state.drawerTaskId);
    if (t2 && el.value) { t2.date = el.value; if (t2.kind === 'untimed') { t2.kind = 'dateonly'; } renderView(); renderWidget(); }
    return;
  }
  if (el.id === 'drawerStart') {
    var t3 = taskById(state.drawerTaskId);
    var v3 = parseHHMM(el.value);
    if (t3 && v3 != null) {
      t3.start = v3;
      if (t3.kind === 'untimed' || t3.kind === 'dateonly') { t3.kind = t3.end != null ? 'block' : 'point'; t3.date = t3.date || TODAY; }
      if (t3.end != null && t3.end <= t3.start) t3.end = Math.min(1440, t3.start + 30);
      renderDrawer(); renderView(); renderWidget();
    }
    return;
  }
  if (el.id === 'drawerEnd') {
    var t4 = taskById(state.drawerTaskId);
    var v4 = parseHHMM(el.value);
    if (t4 && v4 != null) {
      t4.end = Math.max((t4.start == null ? 540 : t4.start) + 15, v4);
      t4.kind = 'block';
      renderDrawer(); renderView(); renderWidget();
    }
    return;
  }
  if (el.id === 'drawerRepeat') {
    var t5 = taskById(state.drawerTaskId);
    if (t5) t5.repeat = el.value;
    return;
  }
}

function onKeyDown(e){
  var ctrl = e.ctrlKey || e.metaKey;
  if (ctrl && e.altKey && e.code === 'Space') { e.preventDefault(); openCapture(); return; }
  if (e.key === 'Escape') {
    if (rpState) { closeRP(); return; }
    if ($('#dayModalOverlay').classList.contains('open')) { closeDayModal(); return; }
    if (state.drawerTaskId) { closeDrawer(); return; }
    if ($('#captureLayer').classList.contains('show')) { closeCapture(); return; }
    return;
  }
  if (e.key === 'Enter' && document.activeElement && document.activeElement.id === 'capInput') {
    e.preventDefault();
    submitCapture();
    return;
  }
  if (e.key === 'Enter' || e.key === ' ') {
    var el = document.activeElement;
    if (!el) return;
    if (el.getAttribute && el.getAttribute('role') === 'button') {
      if (el.hasAttribute('data-task')) { e.preventDefault(); openDrawer(el.getAttribute('data-task')); return; }
      if (el.hasAttribute('data-date')) { e.preventDefault(); openDayModal(el.getAttribute('data-date')); return; }
      if (el.hasAttribute('data-wtask')) { e.preventDefault(); completeTaskAnimated(el.getAttribute('data-wtask'), el); return; }
      if (el.hasAttribute('data-restore')) { e.preventDefault(); restoreAnimated(el); return; }
    }
  }
}

/* ---------------- 21. 重置 / 参数 / 启动 ---------------- */
function closeAllOverlays(){
  closeDrawer();
  closeDayModal();
  closeRP();
  closeCapture();
}
function resetDemo(){
  state = clone(INIT);
  document.documentElement.setAttribute('data-theme', 'pink');
  document.body.classList.remove('anno-off');
  updateThemeButtons();
  var w = $('#widget');
  w.style.width = ''; w.style.height = ''; w.style.left = ''; w.style.top = '';
  w.style.right = ''; w.style.bottom = ''; delete w.dataset.userSized;
  var sel = $('#stateSel'); if (sel) sel.value = 'normal';
  closeAllOverlays();
  syncOverlayDim();
  closeSettings();
  applyWidgetOpacity();
  syncDock();
  renderAll();
  showToast('演示已重置', 1600);
}
function applyParams(){
  var q = new URLSearchParams(location.search);
  if (['pink', 'sage', 'blue'].indexOf(q.get('theme')) >= 0) state.theme = q.get('theme');
  if (q.get('anno') === '0') { state.anno = false; state.dockOpen = false; }
  if (['normal', 'empty', 'offline', 'quota'].indexOf(q.get('state')) >= 0) state.demoState = q.get('state');
  if (q.get('template') === 'list') state.template = 'list';
  if (['day', 'week', 'month'].indexOf(q.get('scale')) >= 0) state.scale = q.get('scale');
  if (['today', 'all'].indexOf(q.get('scope')) >= 0) state.scope = q.get('scope');
  if (q.get('widget') === 'list') state.widgetTemplate = 'list';
  if (q.get('dock') === '0') state.dockOpen = false;
  if (q.get('caloffset')) state.calOffset = parseInt(q.get('caloffset'), 10) || 0;
  if (q.get('static') === '1') document.documentElement.classList.add('static');
  document.body.classList.toggle('anno-off', !state.anno);
  var sel = $('#stateSel'); if (sel) sel.value = state.demoState;
  var ab = $('#annoBtn'); if (ab) ab.classList.toggle('on', state.anno);
  var openWhat = q.get('open');
  if (openWhat) {
    setTimeout(function(){
      if (openWhat === 'settings') openSettings();
      else if (openWhat === 'capture') openCapture();
      else if (openWhat === 'drawer') openDrawer('t3');
      else if (openWhat === 'daymodal') openDayModal(TODAY);
      else if (openWhat === 'fold') { state.doneOpen = true; renderDone(); }
      else if (openWhat === 'range') { openSettings(); setTimeout(function(){ openRangePicker('main'); }, 30); }
    }, 40);
  }
}
function init(){
  renderNotes();
  applyParams();
  setTheme(state.theme);
  syncDock();
  $('#doneHead').insertAdjacentHTML('beforeend', pin(6, 'left:auto;right:14px;top:13px'));
  bindWidget();
  document.addEventListener('click', onClick);
  document.addEventListener('change', onChange);
  document.addEventListener('keydown', onKeyDown);
  window.addEventListener('resize', debounce(function(){
    if (!state.settingsOpen) renderView();
  }, 180));
  renderAll();
}

init();

})();
</script>
