/* ---------------- 14. 时间范围框选 ---------------- */
var rpState = null;
function rpTaskBars(){
  return activeTasks().filter(function(t){ return t.date === TODAY && t.start != null; }).map(function(t){
    var top = (t.start / 1440) * 100;
    if (t.end != null) {
      return '<div class="rp-task" style="top:' + top + '%;height:' + Math.max(0.8, ((t.end - t.start) / 1440) * 100) + '%"></div>';
    }
    return '<div class="rp-point" style="top:' + top + '%"></div>';
  }).join('');
}
function rpLabels(){
  var out = '';
  for (var m = 0; m <= 1320; m += 120) {
    out += '<div class="rp-time num" style="top:' + ((m / 1440) * 100) + '%">' + hhmm(m) + '</div>';
  }
  return out;
}
function openRangePicker(target){
  rpState = {
    target: target,
    start: target === 'main' ? state.rangeMain.start : state.rangeWidget.start,
    end: target === 'main' ? state.rangeMain.end : state.rangeWidget.end,
    hint: '',
    dragging: null
  };
  var overlay = $('#rpOverlay');
  overlay.classList.add('open');
  syncOverlayDim();
  overlay.innerHTML = '<div class="rp-panel" role="dialog" aria-label="选择时间范围">' +
    '<div class="rp-title">' + (target === 'main' ? '选择主窗显示的时间范围' : '选择悬浮窗显示的时间范围') + '</div>' +
    '<div class="rp-desc">拖动选择 · 15 分钟步进 · 至少 2 小时 · 边界撞到时段任务自动完整包进</div>' +
    '<div class="rp-grid"><div class="rp-labels">' + rpLabels() + '</div>' +
      '<div class="rp-ruler" id="rpRuler">' + rpTaskBars() +
        '<div class="rp-mask" id="rpMaskTop"></div><div class="rp-mask" id="rpMaskBottom"></div>' +
        '<div class="rp-select" id="rpSelect"><div class="rp-handle top" data-rp-handle="top"></div>' +
          '<div class="rp-handle bottom" data-rp-handle="bottom"></div>' +
          '<span class="rp-time-label num" id="rpTimeLabel"></span></div>' +
      '</div></div>' +
    '<div class="rp-hint" id="rpHint"></div>' +
    '<div class="rp-foot"><button class="rp-btn" data-rp-cancel>取消</button><button class="rp-btn primary" data-rp-ok>确定</button></div>' +
    '</div>';
  updateRP();
  bindRP();
}
function updateRP(){
  if (!rpState) return;
  var s = rpState.start, e = rpState.end;
  var topPct = (s / 1440) * 100;
  var heightPct = ((e - s) / 1440) * 100;
  var sel = $('#rpSelect');
  if (!sel) return;
  sel.style.top = topPct + '%';
  sel.style.height = heightPct + '%';
  $('#rpMaskTop').style.height = topPct + '%';
  $('#rpMaskBottom').style.top = (topPct + heightPct) + '%';
  $('#rpMaskBottom').style.bottom = '0';
  $('#rpTimeLabel').textContent = hhmm(s) + ' – ' + hhmm(e);
  $('#rpHint').innerHTML = rpState.hint
    ? '<span class="chip-inline"><span class="state-dot ok" style="background:var(--accent-graphic)"></span>' + rpState.hint + '</span>'
    : '';
}
function rpAutoExpand(){
  var dayTasks = activeTasks().filter(function(t){ return t.date === TODAY && t.start != null; });
  var names = [];
  var changed = true;
  var guard = 0;
  while (changed && guard < 4) {
    changed = false;
    guard++;
    for (var i = 0; i < dayTasks.length; i++) {
      var t = dayTasks[i];
      var a = t.start;
      var b = t.end == null ? t.start : t.end;
      if (rpState.start > a && rpState.start < b) {
        rpState.start = a; changed = true;
        names.push(t.title + ' ' + hhmm(t.start) + '–' + hhmm(b));
      }
      if (rpState.end > a && rpState.end < b) {
        rpState.end = b; changed = true;
        names.push(t.title + ' ' + hhmm(t.start) + '–' + hhmm(b));
      }
    }
  }
  var uniq = [];
  names.forEach(function(n){ if (uniq.indexOf(n) < 0) uniq.push(n); });
  rpState.hint = uniq.length ? '已自动包含：' + uniq.join('、') : '';
}
function bindRP(){
  var ruler = $('#rpRuler');
  if (!ruler) return;
  ruler.addEventListener('pointerdown', function(e){
    var handle = e.target.closest('[data-rp-handle]');
    var inSel = e.target.closest('#rpSelect');
    if (!handle && !inSel) return;
    e.preventDefault();
    rpState.dragging = {
      mode: handle ? handle.getAttribute('data-rp-handle') : 'move',
      startY: e.clientY,
      rect: ruler.getBoundingClientRect(),
      start: rpState.start,
      end: rpState.end
    };
    try { ruler.setPointerCapture(e.pointerId); } catch (err) {}
  });
  ruler.addEventListener('pointermove', function(e){
    var d = rpState.dragging;
    if (!d) return;
    var dy = e.clientY - d.startY;
    var dm = Math.round((dy / d.rect.height) * 1440 / 15) * 15;
    var start = d.start, end = d.end;
    if (d.mode === 'top') start = clamp(d.start + dm, 0, end - 120);
    else if (d.mode === 'bottom') end = clamp(d.end + dm, start + 120, 1440);
    else {
      var shift = clamp(dm, -d.start, 1440 - d.end);
      start = d.start + shift;
      end = d.end + shift;
    }
    rpState.start = start;
    rpState.end = end;
    rpAutoExpand();
    updateRP();
  });
  function endDrag(){ if (rpState) rpState.dragging = null; }
  ruler.addEventListener('pointerup', endDrag);
  ruler.addEventListener('pointercancel', endDrag);
  ruler.addEventListener('lostpointercapture', endDrag);
}
function confirmRP(){
  if (!rpState) return;
  var range = { start: rpState.start, end: rpState.end };
  if (rpState.target === 'main') state.rangeMain = range;
  else state.rangeWidget = range;
  closeRP();
  renderAll();
  syncOverlayDim();
}
function syncOverlayDim(){
  var modalOpen = $('#dayModalOverlay').classList.contains('open');
  document.body.classList.toggle('overlay-dim', !!rpState || modalOpen);
}
function closeRP(){
  rpState = null;
  var overlay = $('#rpOverlay');
  overlay.classList.remove('open');
  overlay.innerHTML = '';
  syncOverlayDim();
}

/* ---------------- 15. 捕捉条 / 轻提示 ---------------- */
var capTimer = null;
var toastTimer = null;
function showToast(msg, ms){
  var el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, ms || 2400);
}
function updateCapState(){
  var el = $('#capState');
  if (state.demoState === 'offline') {
    el.innerHTML = '<span class="state-dot"></span>当前离线：语音需要联网，可直接打字；解析使用本地规则';
  } else if (state.demoState === 'quota') {
    el.innerHTML = '<span class="state-dot"></span>今日官方额度已用尽，已使用规则解析；可在设置中配置自己的 Key';
  } else {
    el.textContent = '正在听…';
  }
}
function openCapture(){
  var layer = $('#captureLayer');
  if (layer.classList.contains('show')) { $('#capInput').focus(); return; }
  layer.classList.add('show');
  var input = $('#capInput');
  input.value = '明天下午三点跟张总开会';
  var wave = $('.cap-wave');
  if (wave) wave.style.display = '';
  updateCapState();
  setTimeout(function(){ input.focus(); input.select(); }, 60);
}
function closeCapture(){
  $('#captureLayer').classList.remove('show');
  if (capTimer) { clearTimeout(capTimer); capTimer = null; }
}
function submitCapture(){
  var input = $('#capInput');
  var text = (input.value || '').trim();
  if (!text) return;
  $('#capState').textContent = '正在理解…';
  var wave = $('.cap-wave');
  if (wave) wave.style.display = 'none';
  capTimer = setTimeout(function(){
    capTimer = null;
    var sample = /张总|开会/.test(text);
    var task;
    if (sample) {
      task = { id: 'n' + Date.now(), title: '跟张总开会', date: dateAdd(TODAY, 1), start: 900, kind: 'point' };
      showToast('已创建：跟张总开会 · 明天 15:00');
    } else {
      task = { id: 'n' + Date.now(), title: text.slice(0, 60), kind: 'untimed' };
      showToast('已创建：' + task.title);
    }
    if (state.demoState === 'empty') { state.demoState = 'normal'; var stSel = $('#stateSel'); if (stSel) stSel.value = 'normal'; }
    state.tasks.push(task);
    state.highlightId = task.id;
    closeCapture();
    input.value = '';
    if (wave) wave.style.display = '';
    renderAll();
    setTimeout(function(){ state.highlightId = null; }, 2000);
  }, 650);
}

/* ---------------- 16. 悬浮窗拖拽 / 缩放 ---------------- */
var wDrag = null;
var suppressWidgetClick = false;
function bindWidget(){
  var widget = $('#widget');
  widget.addEventListener('pointerdown', function(e){
    if (e.target.closest('.w-home') || e.target.closest('.w-seg')) return;
    if (e.target.closest('.w-task') || e.target.closest('.w-row')) return;
    var isResize = !!e.target.closest('.w-resize');
    var rect = widget.getBoundingClientRect();
    var sceneRect = $('#scene').getBoundingClientRect();
    wDrag = {
      mode: isResize ? 'resize' : 'move',
      startX: e.clientX, startY: e.clientY,
      left: rect.left - sceneRect.left, top: rect.top - sceneRect.top,
      w: rect.width, h: rect.height,
      sceneW: sceneRect.width, sceneH: sceneRect.height,
      pointerId: e.pointerId,
      moved: false
    };
    widget.classList.add('dragging');
    document.body.classList.add('is-moving');
    try { widget.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  document.addEventListener('pointermove', function(e){
    if (!wDrag || e.pointerId !== wDrag.pointerId) return;
    var dx = e.clientX - wDrag.startX;
    var dy = e.clientY - wDrag.startY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) wDrag.moved = true;
    if (wDrag.mode === 'move') {
      var left = clamp(wDrag.left + dx, 8, Math.max(8, wDrag.sceneW - wDrag.w - 8));
      var top = clamp(wDrag.top + dy, 8, Math.max(8, wDrag.sceneH - wDrag.h - 8));
      widget.style.left = left + 'px';
      widget.style.top = top + 'px';
      widget.style.right = 'auto';
      widget.style.bottom = 'auto';
    } else {
      var nw = clamp(wDrag.w + dx, 260, 480);
      var nh = clamp(wDrag.h + dy, 140, 720);
      widget.style.width = nw + 'px';
      widget.style.height = nh + 'px';
      widget.style.left = wDrag.left + 'px';
      widget.style.top = wDrag.top + 'px';
      widget.style.right = 'auto';
      widget.style.bottom = 'auto';
    }
  });
  document.addEventListener('pointerup', function(e){
    if (!wDrag) return;
    suppressWidgetClick = wDrag.moved;
    if (suppressWidgetClick) setTimeout(function(){ suppressWidgetClick = false; }, 0);
    wDrag = null;
    widget.classList.remove('dragging');
    document.body.classList.remove('is-moving');
    applyWidgetOpacity();
  });
}

/* ---------------- 17. 主题 / 性能 / 标注 / 状态 ---------------- */
function setTheme(theme){
  state.theme = theme;
  document.documentElement.setAttribute('data-theme', theme);
  var btn = $('#themeBtn');
  if (btn) btn.textContent = theme === 'light' ? '深色' : '浅色';
  applyWidgetOpacity();
}
function setPerf(on){
  state.perf = on;
  document.body.classList.toggle('perf', on);
  var btn = $('#perfBtn');
  if (btn) btn.classList.toggle('on', on);
  applyWidgetOpacity();
  if (state.settingsOpen) renderView();
}
function setDemoState(v){
  state.demoState = v;
  var sel = $('#stateSel');
  if (sel) sel.value = v;
  if ($('#captureLayer').classList.contains('show')) updateCapState();
  renderAll();
}
function syncDock(){
  var dock = $('#notesDock');
  dock.classList.toggle('collapsed', !state.dockOpen);
  var btn = $('#dockToggle');
  if (btn) btn.textContent = state.dockOpen ? '收起标注' : '展开标注';
  var annoBtn = $('#annoBtn');
  if (annoBtn) annoBtn.classList.toggle('on', state.anno);
}
function setAnno(on){
  state.anno = on;
  document.body.classList.toggle('anno-off', !on);
  if (on) state.dockOpen = true;
  syncDock();
}
function setDock(open){ state.dockOpen = open; syncDock(); }

/* ---------------- 18. 设置页 / 首页 ---------------- */
function openSettings(){
  closeDrawer();
  closeDayModal();
  closeRP();
  state.settingsOpen = true;
  $('#appwin').classList.add('settings-mode');
  $('#topbarMain').hidden = true;
  $('#topbarSettings').hidden = false;
  renderAll();
}
function closeSettings(){
  state.settingsOpen = false;
  $('#appwin').classList.remove('settings-mode');
  $('#topbarMain').hidden = false;
  $('#topbarSettings').hidden = true;
  renderAll();
}
function goHome(){
  if (state.settingsOpen) closeSettings();
  var w = $('#appwin');
  w.classList.remove('pulse');
  void w.offsetWidth;
  w.classList.add('pulse');
  setTimeout(function(){ w.classList.remove('pulse'); }, 900);
}

/* ---------------- 19. 总渲染 ---------------- */
function renderAll(){
  renderTopbar();
  renderView();
  renderDone();
  renderWidget();
}

/* ---------------- 20. 事件 ---------------- */
function onClick(e){
  var target = e.target;

  var tpl = target.closest('[data-template]');
  if (tpl) { state.template = tpl.getAttribute('data-template'); closeDrawer(); renderAll(); return; }
  var scale = target.closest('[data-scale]');
  if (scale) { state.scale = scale.getAttribute('data-scale'); renderAll(); return; }
  var scope = target.closest('[data-scope]');
  if (scope) { state.scope = scope.getAttribute('data-scope'); renderAll(); return; }
  var calnav = target.closest('[data-calnav]');
  if (calnav) { state.calOffset += parseInt(calnav.getAttribute('data-calnav'), 10); renderCalendar(); return; }
  if (target.closest('#settingsBtn')) { openSettings(); return; }
  if (target.closest('#backBtn')) { closeSettings(); return; }

  if (target.closest('#doneHead')) { state.doneOpen = !state.doneOpen; renderDone(); return; }
  var restore = target.closest('[data-restore]');
  if (restore) { restoreAnimated(restore); return; }

  var doneBtn = target.closest('[data-done]');
  if (doneBtn) {
    e.preventDefault();
    e.stopPropagation();
    completeTaskAnimated(doneBtn.getAttribute('data-done'), doneBtn.closest('.point-task,.block-task,.below-row,.b-row,.dm-row,.wk-point,.wk-block'));
    return;
  }

  var wtask = target.closest('[data-wtask]');
  if (wtask) {
    if (suppressWidgetClick) return;
    completeTaskAnimated(wtask.getAttribute('data-wtask'), wtask);
    return;
  }

  var taskEl = target.closest('[data-task]');
  if (taskEl) {
    if (taskEl.closest('.day-modal')) closeDayModal();
    openDrawer(taskEl.getAttribute('data-task'));
    return;
  }

  var cell = target.closest('[data-date]');
  if (cell) { openDayModal(cell.getAttribute('data-date')); return; }

  if (target.closest('[data-home]')) { goHome(); return; }

  var wscope = target.closest('[data-wscope]');
  if (wscope) { state.widgetScope = wscope.getAttribute('data-wscope'); renderWidget(); return; }

  var wtpl = target.closest('[data-widget-template]');
  if (wtpl) { state.widgetTemplate = wtpl.getAttribute('data-widget-template'); renderView(); renderWidget(); return; }
  var wop = target.closest('[data-widget-opacity]');
  if (wop) { state.widgetOpacity = parseFloat(wop.getAttribute('data-widget-opacity')); applyWidgetOpacity(); renderView(); return; }
  if (target.closest('[data-perf-toggle]')) { setPerf(!state.perf); return; }
  var rangeBtn = target.closest('[data-range]');
  if (rangeBtn) { openRangePicker(rangeBtn.getAttribute('data-range')); return; }

  if (target.closest('[data-rp-cancel]')) { closeRP(); return; }
  if (target.closest('[data-rp-ok]')) { confirmRP(); return; }

  if (target.closest('[data-drawer-close]')) { closeDrawer(); return; }
  if (target.closest('#drawerScrim')) { closeDrawer(); return; }
  var chip = target.closest('[data-timemode]');
  if (chip) { setTimeMode(chip.getAttribute('data-timemode')); return; }
  if (target.closest('#deleteBtn')) {
    var del = $('#deleteBtn');
    if (del) del.style.display = 'none';
    var cf = $('#deleteConfirm');
    if (cf) cf.classList.add('show');
    return;
  }
  if (target.closest('#cancelDelete')) {
    var cf2 = $('#deleteConfirm');
    if (cf2) cf2.classList.remove('show');
    var del2 = $('#deleteBtn');
    if (del2) del2.style.display = '';
    return;
  }
  if (target.closest('#confirmDelete')) {
    var id = state.drawerTaskId;
    if (id) {
      state.tasks = state.tasks.filter(function(t){ return t.id !== id; });
      closeDrawer();
      renderAll();
      if (state.modalDate) refreshDayModal();
    }
    return;
  }

  if (target.closest('[data-daymodal-close]')) { closeDayModal(); return; }
  var modalBg = target.closest('#dayModalOverlay');
  if (modalBg && target === modalBg) { closeDayModal(); return; }

  if (target.closest('#captureBtn')) { openCapture(); return; }
  if (target.closest('#captureLayer') && !target.closest('.capture')) { closeCapture(); return; }

  if (target.closest('#themeBtn')) { setTheme(state.theme === 'light' ? 'dark' : 'light'); return; }
  if (target.closest('#perfBtn')) { setPerf(!state.perf); return; }
  if (target.closest('#annoBtn')) { setAnno(!state.anno); return; }
  if (target.closest('#dockToggle')) { setDock(!state.dockOpen); return; }
  if (target.closest('#resetBtn')) { resetDemo(); return; }
}

function onChange(e){
  var el = e.target;
  if (el.id === 'stateSel') { setDemoState(el.value); return; }
  if (el.id === 'drawerTitle') {
    var t = taskById(state.drawerTaskId);
    if (t) {
      var v = (el.value || '').trim();
      if (v) t.title = v;
      renderView();
      renderWidget();
    }
    return;
  }
  if (el.id === 'drawerDate') {
    var t2 = taskById(state.drawerTaskId);
    if (t2 && el.value) { t2.date = el.value; if (t2.kind === 'untimed') { t2.kind = 'dateonly'; } renderView(); renderWidget(); }
    return;
  }
  if (el.id === 'drawerStart') {
    var t3 = taskById(state.drawerTaskId);
    var v3 = parseHHMM(el.value);
    if (t3 && v3 != null) {
      t3.start = v3;
      if (t3.kind === 'untimed' || t3.kind === 'dateonly') { t3.kind = t3.end != null ? 'block' : 'point'; t3.date = t3.date || TODAY; }
      if (t3.end != null && t3.end <= t3.start) t3.end = Math.min(1440, t3.start + 30);
      renderDrawer(); renderView(); renderWidget();
    }
    return;
  }
  if (el.id === 'drawerEnd') {
    var t4 = taskById(state.drawerTaskId);
    var v4 = parseHHMM(el.value);
    if (t4 && v4 != null) {
      t4.end = Math.max((t4.start == null ? 540 : t4.start) + 15, v4);
      t4.kind = 'block';
      renderDrawer(); renderView(); renderWidget();
    }
    return;
  }
  if (el.id === 'drawerRepeat') {
    var t5 = taskById(state.drawerTaskId);
    if (t5) t5.repeat = el.value;
    return;
  }
}

function onKeyDown(e){
  var ctrl = e.ctrlKey || e.metaKey;
  if (ctrl && e.altKey && e.code === 'Space') { e.preventDefault(); openCapture(); return; }
  if (e.key === 'Escape') {
    if (rpState) { closeRP(); return; }
    if ($('#dayModalOverlay').classList.contains('open')) { closeDayModal(); return; }
    if (state.drawerTaskId) { closeDrawer(); return; }
    if ($('#captureLayer').classList.contains('show')) { closeCapture(); return; }
    return;
  }
  if (e.key === 'Enter' && document.activeElement && document.activeElement.id === 'capInput') {
    e.preventDefault();
    submitCapture();
    return;
  }
  if (e.key === 'Enter' || e.key === ' ') {
    var el = document.activeElement;
    if (!el) return;
    if (el.getAttribute && el.getAttribute('role') === 'button') {
      if (el.hasAttribute('data-task')) { e.preventDefault(); openDrawer(el.getAttribute('data-task')); return; }
      if (el.hasAttribute('data-date')) { e.preventDefault(); openDayModal(el.getAttribute('data-date')); return; }
      if (el.hasAttribute('data-wtask')) { e.preventDefault(); completeTaskAnimated(el.getAttribute('data-wtask'), el); return; }
      if (el.hasAttribute('data-restore')) { e.preventDefault(); restoreAnimated(el); return; }
    }
  }
}

/* ---------------- 21. 重置 / 参数 / 启动 ---------------- */
function closeAllOverlays(){
  closeDrawer();
  closeDayModal();
  closeRP();
  closeCapture();
}
function resetDemo(){
  state = clone(INIT);
  document.documentElement.setAttribute('data-theme', 'light');
  document.body.classList.remove('perf', 'anno-off');
  var w = $('#widget');
  w.style.width = ''; w.style.height = ''; w.style.left = ''; w.style.top = '';
  w.style.right = ''; w.style.bottom = '';
  var sel = $('#stateSel'); if (sel) sel.value = 'normal';
  var tb = $('#themeBtn'); if (tb) tb.textContent = '深色';
  var pb = $('#perfBtn'); if (pb) pb.classList.remove('on');
  closeAllOverlays();
  syncOverlayDim();
  closeSettings();
  applyWidgetOpacity();
  syncDock();
  renderAll();
  showToast('演示已重置', 1600);
}
function applyParams(){
  var q = new URLSearchParams(location.search);
  if (q.get('theme') === 'dark') state.theme = 'dark';
  if (q.get('perf') === '1') state.perf = true;
  if (q.get('anno') === '0') { state.anno = false; state.dockOpen = false; }
  if (['normal', 'empty', 'offline', 'quota'].indexOf(q.get('state')) >= 0) state.demoState = q.get('state');
  if (q.get('template') === 'list') state.template = 'list';
  if (['day', 'week', 'month'].indexOf(q.get('scale')) >= 0) state.scale = q.get('scale');
  if (['today', 'all'].indexOf(q.get('scope')) >= 0) state.scope = q.get('scope');
  if (q.get('widget') === 'list') state.widgetTemplate = 'list';
  if (q.get('dock') === '0') state.dockOpen = false;
  if (q.get('caloffset')) state.calOffset = parseInt(q.get('caloffset'), 10) || 0;
  if (q.get('static') === '1') document.documentElement.classList.add('static');
  document.body.classList.toggle('perf', state.perf);
  document.body.classList.toggle('anno-off', !state.anno);
  var sel = $('#stateSel'); if (sel) sel.value = state.demoState;
  var pb = $('#perfBtn'); if (pb) pb.classList.toggle('on', state.perf);
  var ab = $('#annoBtn'); if (ab) ab.classList.toggle('on', state.anno);
  var openWhat = q.get('open');
  if (openWhat) {
    setTimeout(function(){
      if (openWhat === 'settings') openSettings();
      else if (openWhat === 'capture') openCapture();
      else if (openWhat === 'drawer') openDrawer('t3');
      else if (openWhat === 'daymodal') openDayModal(TODAY);
      else if (openWhat === 'fold') { state.doneOpen = true; renderDone(); }
      else if (openWhat === 'range') { openSettings(); setTimeout(function(){ openRangePicker('main'); }, 30); }
    }, 40);
  }
}
function init(){
  renderNotes();
  applyParams();
  setTheme(state.theme);
  syncDock();
  $('#doneHead').insertAdjacentHTML('beforeend', pin(6, 'left:auto;right:14px;top:13px'));
  bindWidget();
  document.addEventListener('click', onClick);
  document.addEventListener('change', onChange);
  document.addEventListener('keydown', onKeyDown);
  window.addEventListener('resize', debounce(function(){
    if (!state.settingsOpen) renderView();
  }, 180));
  renderAll();
}

init();

})();
</script>
