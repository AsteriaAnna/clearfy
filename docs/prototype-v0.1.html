<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clarify · 可点击线框 v0.1</title>
<style>
  :root{
    --paper:#f6f4ee; --card:#fffefb; --ink:#22211d; --muted:#8d8779;
    --line:#e8e3d8; --accent:#3d6b52; --accent-soft:#e9efe9;
    --warn:#a85434; --warn-soft:#f7ebe4; --shadow:0 12px 34px rgba(34,33,29,.12);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);
    font:14px/1.5 "Segoe UI Variable","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .app{display:flex;height:100vh}
  /* ---------- 侧边栏 ---------- */
  .sidebar{width:208px;flex:0 0 208px;padding:22px 14px;display:flex;flex-direction:column;gap:2px;
    border-right:1px solid var(--line);background:linear-gradient(180deg,#faf8f3,#f6f4ee)}
  .brand{display:flex;align-items:center;gap:9px;padding:0 10px 22px;user-select:none}
  .logo{width:24px;height:24px;border-radius:8px;background:var(--accent);position:relative}
  .logo::after{content:"";position:absolute;inset:7px;border-radius:50%;border:2px solid #fff}
  .brand b{font-size:15px;letter-spacing:.2px}
  .brand span{font-size:11px;color:var(--muted);margin-left:2px}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:#4b4840;
    text-align:left;width:100%}
  .nav button:hover{background:#efebe2}
  .nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .nav .ico{width:17px;height:17px;flex:0 0 17px;display:grid;place-items:center;opacity:.85}
  .nav .cnt{margin-left:auto;font-size:11px;color:var(--muted);background:#efebe2;border-radius:20px;
    padding:0 6px;line-height:17px;min-width:18px;text-align:center}
  .nav small{display:block;padding:14px 10px 6px;color:#b0a999;font-size:11px;letter-spacing:.08em}
  .side-foot{margin-top:auto;padding:10px;color:var(--muted);font-size:11px;line-height:1.7}
  .side-foot kbd{background:#ece7dc;border-radius:4px;padding:0 4px;font-family:inherit;font-size:10px}
  /* ---------- 主区 ---------- */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
  .topbar{height:58px;flex:0 0 58px;display:flex;align-items:center;gap:12px;padding:0 28px;
    border-bottom:1px solid var(--line);background:rgba(255,254,251,.7);backdrop-filter:blur(8px)}
  .search{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;
    background:#f0ece2;border:1px solid transparent;border-radius:9px;padding:7px 12px;width:240px}
  .search:hover{border-color:var(--line);background:#fffefb;cursor:text}
  .topbar .spacer{flex:1}
  .btn{display:inline-flex;align-items:center;gap:7px;border-radius:9px;padding:8px 13px;font-size:13px;
    border:1px solid var(--line);background:var(--card);transition:.15s}
  .btn:hover{box-shadow:0 2px 8px rgba(34,33,29,.06);transform:translateY(-1px)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.07)}
  .btn.ghost{border-color:transparent;color:var(--muted)}
  .btn.ghost:hover{background:#efebe2;color:var(--ink)}
  .view{flex:1;overflow:auto;padding:30px 28px 120px}
  .wrap{max-width:760px;margin:0 auto;animation:in .18s ease-out}
  @keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  h1{font-size:25px;margin:0 0 2px;letter-spacing:.2px}
  .sub{color:var(--muted);font-size:12.5px;margin-bottom:22px}
  .quick{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:11px 13px;color:var(--muted);margin-bottom:26px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
  .quick:hover{border-color:#d9d2c2;cursor:text}
  .quick .spacer{flex:1}
  .quick kbd{font-family:inherit;font-size:10.5px;color:#a7a090;background:#f3efe5;padding:2px 6px;border-radius:5px}
  .group{margin:0 0 8px;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11.5px;
    letter-spacing:.06em;text-transform:uppercase}
  .group .line{flex:1;height:1px;background:var(--line)}
  .group b{color:var(--warn);font-weight:600}
  .task{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;transition:.18s;
    position:relative}
  .task:hover{background:#fbf9f4}
  .check{width:18px;height:18px;flex:0 0 18px;border:1.6px solid #c9c2b2;border-radius:50%;
    display:grid;place-items:center;transition:.15s;color:transparent;font-size:11px}
  .check:hover{border-color:var(--accent);background:var(--accent-soft)}
  .task .t{flex:1;min-width:0}
  .task .title{font-size:14px;letter-spacing:.1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .task .meta{font-size:11.5px;color:var(--muted);margin-top:1px;display:flex;gap:7px;align-items:center}
  .chip{font-size:10.5px;padding:1px 6px;border-radius:20px;background:#f1ede3;color:#78715f}
  .chip.warn{background:var(--warn-soft);color:var(--warn)}
  .chip.ai{background:#eef1f8;color:#54628c}
  .task .actions{display:flex;gap:2px;opacity:0;transition:.15s}
  .task:hover .actions{opacity:1}
  .task .actions button{color:var(--muted);font-size:11.5px;padding:4px 7px;border-radius:6px}
  .task .actions button:hover{background:#efebe2;color:var(--ink)}
  .task.done .title{text-decoration:line-through;color:#b3ac9d}
  .task.done{opacity:0;transform:translateX(8px);transition:.28s}
  .empty{padding:38px 0;text-align:center;color:#b0a999;font-size:13px;line-height:2}
  .empty b{display:block;color:#8d8779;font-size:15px;margin-bottom:4px}
  .banner{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:10px 14px;color:var(--muted);font-size:12.5px;margin-bottom:22px}
  .banner .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:0 0 7px}
  /* ---------- 悬浮窗设置页 ---------- */
  .settings-grid{display:grid;grid-template-columns:1fr 320px;gap:26px;align-items:start}
  .desk{height:290px;border-radius:14px;border:1px solid var(--line);position:relative;overflow:hidden;
    background:
      radial-gradient(circle at 18% 20%,#e9e3d4,transparent 42%),
      radial-gradient(circle at 82% 78%,#dfe7df,transparent 46%),
      linear-gradient(135deg,#eee9dd,#e3dfd3)}
  .desk .hint{position:absolute;left:16px;top:14px;font-size:11px;color:#9a9484}
  .desk .widget{position:absolute;right:22px;bottom:20px;box-shadow:0 16px 40px rgba(50,45,35,.16);cursor:grab}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
  .panel h3{margin:0 0 4px;font-size:13px}
  .panel .desc{color:var(--muted);font-size:11.5px;margin-bottom:14px}
  .field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;
    border-top:1px solid #f2eee5;font-size:13px}
  .field:first-of-type{border-top:0}
  .field .lab small{display:block;color:var(--muted);font-size:11px;margin-top:1px}
  .seg{display:flex;background:#f0ece2;border-radius:8px;padding:2px;gap:2px}
  .seg button{padding:4px 9px;border-radius:6px;font-size:11.5px;color:var(--muted)}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.07)}
  input[type=range]{width:104px;accent-color:var(--accent)}
  .switch{width:34px;height:20px;border-radius:20px;background:#ddd7c9;position:relative;transition:.18s;flex:0 0 34px}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
    background:#fff;transition:.18s;box-shadow:0 1px 2px rgba(0,0,0,.18)}
  .switch.on{background:var(--accent)}
  .switch.on::after{left:16px}
  .note{color:var(--muted);font-size:11px;margin-top:12px;line-height:1.7}
  /* ---------- 设置页 ---------- */
  .set-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 20px;margin-bottom:16px}
  .set-card h3{margin:0 0 12px;font-size:13px}
  .set-card .field{border-top-color:#f4f0e7;padding:10px 0}
  .val{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:8px}
  .pill{font-size:10.5px;background:var(--accent-soft);color:var(--accent);padding:2px 7px;border-radius:20px}
  /* ---------- 常驻悬浮窗 ---------- */
  .widget{width:264px;background:rgba(255,254,251,.94);border:1px solid rgba(232,227,216,.9);
    border-radius:16px;box-shadow:var(--shadow);backdrop-filter:blur(14px);overflow:hidden;
    font-size:13px;user-select:none;z-index:40}
  .widget .w-head{display:flex;align-items:center;gap:8px;padding:11px 14px 8px;color:var(--muted);font-size:11.5px}
  .widget .w-head b{color:var(--ink);font-size:12.5px;font-weight:600}
  .widget .w-head .n{margin-left:auto;font-size:10.5px;color:#a7a090}
  .widget .w-list{padding:0 8px 6px;max-height:190px;overflow:auto}
  .w-item{display:flex;align-items:center;gap:9px;padding:7px 6px;border-radius:8px}
  .w-item:hover{background:#f6f2e9}
  .w-item .check{width:16px;height:16px;flex:0 0 16px;font-size:10px}
  .w-item .wt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
  .w-item .when{font-size:10.5px;color:#a7a090;flex:0 0 auto}
  .w-item .when.warn{color:var(--warn)}
  .w-add{margin:2px 8px 8px;display:flex;align-items:center;gap:8px;color:var(--accent);
    background:var(--accent-soft);border-radius:9px;padding:8px 10px;font-size:12px;font-weight:600;
    width:calc(100% - 16px);justify-content:center}
  .w-add:hover{filter:brightness(.98)}
  .w-foot{display:flex;align-items:center;justify-content:space-between;padding:0 14px 9px;
    color:#b3ac9d;font-size:10px}
  .w-mode-min .w-list,.w-mode-min .w-head b{display:none}
  .w-mode-min{width:170px}
  /* ---------- 捕捉条 ---------- */
  .capture-mask{position:fixed;inset:0;background:rgba(34,33,29,.16);backdrop-filter:blur(2px);
    display:none;place-items:start center;padding-top:16vh;z-index:60}
  .capture-mask.show{display:grid}
  .capture{width:min(620px,92vw);background:var(--card);border:1px solid var(--line);border-radius:18px;
    box-shadow:0 30px 80px rgba(34,33,29,.22);padding:16px 18px;animation:up .2s ease-out}
  @keyframes up{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
  .cap-top{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
  .cap-top .rec{display:flex;align-items:flex-end;gap:2px;height:18px}
  .cap-top .rec i{width:3px;border-radius:2px;background:var(--accent);animation:wave .9s ease-in-out infinite}
  .cap-top .rec i:nth-child(1){height:6px;animation-delay:0s}
  .cap-top .rec i:nth-child(2){height:12px;animation-delay:.12s}
  .cap-top .rec i:nth-child(3){height:17px;animation-delay:.24s}
  .cap-top .rec i:nth-child(4){height:10px;animation-delay:.36s}
  .cap-top .rec i:nth-child(5){height:5px;animation-delay:.48s}
  @keyframes wave{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1.15)}}
  .cap-top .live{color:var(--ink);font-size:13px}
  .cap-top .esc{margin-left:auto;font-size:10.5px;color:#b3ac9d}
  .cap-input{margin-top:12px;display:flex;align-items:center;gap:10px}
  .cap-input input{flex:1;border:0;outline:0;background:#f7f4ec;border-radius:10px;padding:12px 13px;
    font:inherit;font-size:14px;color:var(--ink)}
  .cap-input input::placeholder{color:#b8b1a1}
  .cap-sub{margin-top:10px;display:flex;align-items:center;gap:8px;color:#a7a090;font-size:11px}
  .cap-sub .btn{padding:6px 10px;font-size:12px}
  /* ---------- toast ---------- */
  .toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
    background:#2b2a25;color:#f7f5ef;border-radius:12px;padding:11px 16px;font-size:12.5px;z-index:70;
    display:flex;align-items:center;gap:12px;transition:.22s;box-shadow:0 12px 30px rgba(0,0,0,.2)}
  .toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .toast button{color:#cfe3d4;font-weight:600;font-size:12px}
  .toast .sub{color:#b9b3a2;font-size:11px}
  .draft{position:relative}
  .draft::after{content:"正在理解…";position:absolute;right:10px;top:50%;transform:translateY(-50%);
    font-size:10.5px;color:#54628c;background:#eef1f8;padding:2px 7px;border-radius:20px;
    animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
  .tiny{font-size:11px;color:#b3ac9d}
  ::-webkit-scrollbar{width:9px}
  ::-webkit-scrollbar-thumb{background:#ddd7c9;border-radius:9px;border:2px solid transparent;background-clip:content-box}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo"></div><b>Clarify</b><span>线框 v0.1</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      捕捉 <kbd>Ctrl+Alt+Space</kbd><br>
      显示/隐藏悬浮窗 <kbd>Ctrl+Alt+W</kbd><br>
      <span class="tiny">点击左侧导航、勾选框、＋ 体验</span>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="search" onclick="toast('搜索：v1 只搜标题/备注（⌘K 命令面板）')">⌕&nbsp; 搜索待办</div>
      <div class="spacer"></div>
      <button class="btn ghost" onclick="openCapture()">⌨ Ctrl+K</button>
      <button class="btn primary" onclick="openCapture()">＋ 新建</button>
    </div>
    <div class="view" id="view"></div>
  </main>
</div>

<!-- 常驻悬浮窗（真实产品中始终置顶） -->
<div style="position:fixed;right:26px;bottom:26px;z-index:40" id="widgetHost"></div>

<!-- 捕捉条 -->
<div class="capture-mask" id="captureMask" onclick="if(event.target===this)closeCapture()">
  <div class="capture">
    <div class="cap-top">
      <div class="rec"><i></i><i></i><i></i><i></i><i></i></div>
      <span class="live" id="capTitle">正在听… 说完停顿 1 秒自动结束</span>
      <span class="esc">Esc 取消 · 按住说话 / 直接打字</span>
    </div>
    <div class="cap-input">
      <input id="capInput" placeholder="比如：明天下午三点跟张总开会，顺便买牛奶" onkeydown="if(event.key==='Enter')submitCapture()">
      <button class="btn primary" onclick="submitCapture()">发送</button>
    </div>
    <div class="cap-sub">
      <span>✨ 本地 AI 会理解并拆成待办</span>
      <span style="flex:1"></span>
      <span>不留音频 · 离线可用</span>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span id="toastText"></span><button id="toastBtn" style="display:none"></button></div>

<script>
/* ---------------- 数据 ---------------- */
let idc = 100;
const state = {
  view: 'today',
  tasks: [
    {id:1, title:'与张总同步 Q4 方案', when:'今天 15:00', bucket:'today', done:false, review:false},
    {id:2, title:'回复产品评审邮件', when:'今天 10:30', bucket:'today', done:false, review:false},
    {id:3, title:'跑步 3 km', when:'每天 · 今天', bucket:'today', done:false, review:false},
    {id:4, title:'交房租', when:'昨天 18:00', bucket:'overdue', done:false, review:false},
    {id:5, title:'买牛奶', when:'', bucket:'inbox', done:false, review:true},
    {id:6, title:'研究一下旅游保险', when:'', bucket:'inbox', done:false, review:true},
  ],
  done: [
    {id:11, title:'给妈妈回电话', at:'今天 09:12'},
    {id:12, title:'提交周报', at:'今天 08:40'},
  ],
  widgetMode: 'today',   // today | next | inbox | min
  untouched: false,
};
const FLAT = () => [...state.tasks, ...state.done];

/* ---------------- 图标 ---------------- */
const I = {
  sun:'<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>',
  inbox:'<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-2 8h-4l-1.2 2H11.2L10 13H6L4 5z"/><path d="M4 13v5h16v-5"/></svg>',
  list:'<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>',
  check:'<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>',
  widget:'<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="14" rx="2.5"/><path d="M8 21h8"/></svg>',
  gear:'<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>',
  mic:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0013 0M12 18v3"/></svg>',
  close:'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>'
};
const NAV = [
  {k:'today', label:'今日', ico:I.sun},
  {k:'inbox', label:'收件箱', ico:I.inbox},
  {k:'all',   label:'全部待办', ico:I.list},
  {k:'done',  label:'已完成', ico:I.check},
  null,
  {k:'widget',label:'悬浮窗', ico:I.widget},
  {k:'settings',label:'设置', ico:I.gear},
];

/* ---------------- 渲染 ---------------- */
function renderNav(){
  const n = document.getElementById('nav');
  n.innerHTML = NAV.map(item=>{
    if(!item) return '<small>整理</small>';
    const cnt = item.k==='inbox'
      ? state.tasks.filter(t=>t.bucket==='inbox').length
      : item.k==='done' ? state.done.length : 0;
    return `<button class="${state.view===item.k?'active':''}" onclick="go('${item.k}')">
      <span class="ico">${item.ico}</span>${item.label}${cnt?`<span class="cnt">${cnt}</span>`:''}</button>`;
  }).join('');
}
function row(t, ctx){
  const meta = t.when ? `<div class="meta"><span class="${t.bucket==='overdue'?'chip warn':''}">${t.when}</span>${t.review?'<span class="chip ai">✨ 待安排</span>':''}</div>` : (t.review?'<div class="meta"><span class="chip ai">✨ 待安排</span></div>':'');
  const actions = ctx==='inbox'
    ? `<button onclick="event.stopPropagation();plan(${t.id},'today');toast('已安排到今天')">今天</button>
       <button onclick="event.stopPropagation();plan(${t.id},'tomorrow');toast('已安排到明天')">明天</button>`
    : `<button onclick="event.stopPropagation();toast('推迟：明天 09:00（演示）')">推迟</button>
       <button onclick="event.stopPropagation();toast('已打开详情抽屉（演示）')">编辑</button>`;
  return `<div class="task" id="task-${t.id}">
    <div class="check" onclick="complete(${t.id})">✓</div>
    <div class="t"><div class="title">${esc(t.title)}</div>${meta}</div>
    <div class="actions">${actions}</div>
  </div>`;
}
function viewToday(){
  const od = state.tasks.filter(t=>t.bucket==='overdue');
  const td = state.tasks.filter(t=>t.bucket==='today');
  const hh = String(Math.floor(td.length*0.5+14)); // 假数据
  return `<div class="wrap">
    <h1>今天</h1>
    <div class="sub">11月1日 星期六 · 共 ${od.length+td.length} 件事 · 预计约 2 小时</div>
    <div class="quick" onclick="openCapture()">✨ 说一句，或输入待办…<span class="spacer"></span><kbd>Ctrl+Alt+Space</kbd> ${I.mic}</div>
    ${od.length?`<div class="group"><b>逾期</b><span class="line"></span></div>${od.map(t=>row(t,'today')).join('')}`:''}
    <div class="group">今天<span class="line"></span></div>
    ${td.length?td.map(t=>row(t,'today')).join(''):`<div class="empty"><b>今天清空了</b>说一句试试，或者享受这片安静。</div>`}
    <div class="group" style="margin-top:22px">今天已完成 · ${state.done.length}<span class="line"></span></div>
    ${state.done.map(d=>`<div class="task" style="opacity:.65"><div class="check" style="border-color:var(--accent);background:var(--accent);color:#fff">✓</div>
      <div class="t"><div class="title" style="text-decoration:line-through;color:#a9a293">${esc(d.title)}</div>
      <div class="meta"><span class="chip">${d.at} 完成</span><span class="chip">24h 后自动清除</span></div></div></div>`).join('')}
    <div class="tiny" style="margin-top:18px">完成项 24 小时后自动归档，30 天内可在回收站恢复 · 不留痕迹，但不会丢</div>
  </div>`;
}
function viewInbox(){
  const list = state.tasks.filter(t=>t.bucket==='inbox');
  return `<div class="wrap">
    <h1>收件箱</h1>
    <div class="sub">AI 没把握或没有时间线索的事，先放这儿 · 点一下就能安排</div>
    <div class="banner"><span class="dot"></span>${list.length?`${list.length} 项待安排：可以一键排到今天/明天，也可以先放着`:`都安排好了，收件箱是空的`}</div>
    ${list.length?list.map(t=>row(t,'inbox')).join(''):`<div class="empty"><b>收件箱是空的</b>没有需要你整理的东西，这就是我们想要的。</div>`}
    <div class="tiny" style="margin-top:18px">解析置信度低的条目会带 ✨ 标记；不确认的话，它就一直留在收件箱，不会占用悬浮窗</div>
  </div>`;
}
function viewAll(){
  const groups=[['逾期',state.tasks.filter(t=>t.bucket==='overdue')],['今天',state.tasks.filter(t=>t.bucket==='today')],['未安排',state.tasks.filter(t=>t.bucket==='inbox')]];
  return `<div class="wrap">
    <h1>全部待办</h1>
    <div class="sub">v1 不做清单/项目层级：只用时间分组 · 搜索与标签筛选放 v1.1</div>
    ${groups.map(([k,v])=>v.length?`<div class="group">${k}<span class="line"></span></div>${v.map(t=>row(t,'all')).join('')}`:'').join('')}
  </div>`;
}
function viewDone(){
  return `<div class="wrap">
    <h1>已完成</h1>
    <div class="sub">只保留 24 小时 · 到点自动归档，台面永远清晰</div>
    <div class="banner"><span class="dot"></span>今天已完成 ${state.done.length} 项 · 最近一项 22 小时后自动清除</div>
    ${state.done.map(d=>`<div class="task"><div class="check" style="border-color:var(--accent);background:var(--accent);color:#fff">✓</div>
      <div class="t"><div class="title" style="text-decoration:line-through;color:#a9a293">${esc(d.title)}</div>
      <div class="meta"><span class="chip">${d.at} 完成</span></div></div>
      <div class="actions"><button onclick="restore(${d.id})">恢复</button></div></div>`).join('')}
    <div class="tiny" style="margin-top:16px">误点完成没关系：这里可恢复；5 秒内也会出现「撤销」提示</div>
  </div>`;
}
function viewWidget(){
  return `<div class="wrap" style="max-width:980px">
    <h1>悬浮窗</h1>
    <div class="sub">改完即时生效 · 拖到桌面任意位置即记住 · 它就是你的"台面"</div>
    <div class="settings-grid">
      <div class="desk">
        <div class="hint">桌面预览 · 悬浮窗始终置顶，不打扰其他窗口</div>
        <div class="widget" id="deskWidget"></div>
        <div style="position:absolute;left:16px;bottom:14px" class="tiny">拖动移动 · 边缘自动吸附</div>
      </div>
      <div class="panel">
        <h3>显示方式</h3>
        <div class="desc">v0.1 建议先做 3 种，做精再扩</div>
        <div class="seg" style="margin-bottom:14px" id="modeSeg"></div>
        <div class="field"><div class="lab">最大条目数<small>超过自动折叠</small></div><span class="val">5</span></div>
        <div class="field"><div class="lab">不透明度</div><input type="range" min="30" max="100" value="94" oninput="setOpacity(this.value)"></div>
        <div class="field"><div class="lab">始终置顶</div><button class="switch on" onclick="tog(this)"></button></div>
        <div class="field"><div class="lab">点击穿透<small>不挡你操作别的窗口</small></div><button class="switch" onclick="tog(this)"></button></div>
        <div class="field"><div class="lab">全屏应用时自动隐藏</div><button class="switch on" onclick="tog(this)"></button></div>
        <div class="field"><div class="lab">开机后显示</div><button class="switch on" onclick="tog(this)"></button></div>
        <div style="display:flex;gap:8px;margin-top:14px">
          <button class="btn" style="flex:1" onclick="toast('已恢复默认设置（演示）')">恢复默认</button>
          <button class="btn primary" style="flex:1" onclick="toast('设置已即时生效，无需保存')">完成</button>
        </div>
        <div class="note">悬浮窗里的「＋」直接在原地展开迷你输入，不跳主窗口——少一次跳转，就多一次坚持。</div>
      </div>
    </div>
  </div>`;
}
function viewSettings(){
  return `<div class="wrap" style="max-width:840px">
    <h1>设置</h1>
    <div class="sub">所有数据都在本机 · 不登录 · 不联网（除模型下载）</div>
    <div class="set-card"><h3>通用</h3>
      <div class="field"><div class="lab">开机启动<small>托盘常驻，提醒才可靠</small></div><button class="switch on" onclick="tog(this)"></button></div>
      <div class="field"><div class="lab">主题</div><div class="seg"><button class="on">跟随系统</button><button>浅色</button><button>深色</button></div></div>
      <div class="field"><div class="lab">语音捕捉快捷键</div><span class="val">Ctrl + Alt + Space <span class="pill">可改</span></span></div>
      <div class="field"><div class="lab">显示/隐藏悬浮窗</div><span class="val">Ctrl + Alt + W</span></div>
    </div>
    <div class="set-card"><h3>语音与 AI</h3>
      <div class="field"><div class="lab">语音识别模型<small>中文 / 中英混说 · 本地运行</small></div><span class="val">SenseVoice Small · 231 MB <span class="pill">已就绪</span></span></div>
      <div class="field"><div class="lab">理解模型<small>把一句话解析成结构化待办</small></div><span class="val">Qwen3 4B · 2.5 GB <span class="pill">已就绪</span></span></div>
      <div class="field"><div class="lab">GPU 加速<small>检测到 RTX 4060，可加快解析</small></div><button class="switch on" onclick="tog(this)"></button></div>
      <div class="field"><div class="lab">「明天」的默认时间</div><span class="val">09:00（可改为全天）</span></div>
      <div class="field"><div class="lab">空闲 10 分钟后卸载模型<small>省内存/省电，下次捕捉前预热</small></div><button class="switch on" onclick="tog(this)"></button></div>
    </div>
    <div class="set-card"><h3>数据与隐私</h3>
      <div class="field"><div class="lab">数据位置</div><span class="val">AppData/Clarify/clarify.db <span class="pill">可迁移</span></span></div>
      <div class="field"><div class="lab">每日自动备份（保留 7 天）</div><button class="switch on" onclick="tog(this)"></button></div>
      <div class="field"><div class="lab">导出 / 导入</div><span class="val">JSON · Markdown</span></div>
      <div class="field"><div class="lab">音频</div><span class="val">用完即弃，不留存</span></div>
    </div>
    <div class="tiny">线框 v0.1 · 用于讨论页面结构与按钮，不是最终视觉；深色/动效/无障碍未画</div>
  </div>`;
}
const VIEWS = {today:viewToday, inbox:viewInbox, all:viewAll, done:viewDone, widget:viewWidget, settings:viewSettings};
function render(){
  renderNav();
  document.getElementById('view').innerHTML = VIEWS[state.view]();
  renderWidget();
  if(state.view==='widget') renderWidgetSettings();
}
function renderWidget(){
  document.getElementById('widgetHost').innerHTML = widgetHTML();
  const desk = document.getElementById('deskWidget');
  if(desk) desk.innerHTML = widgetInner();
}
function widgetHTML(){
  const items = widgetItems();
  return `<div class="widget ${state.widgetMode==='min'?'w-mode-min':''}" id="floatWidget">${widgetInner()}</div>`;
}
function widgetItems(){
  if(state.widgetMode==='next') return state.tasks.filter(t=>t.bucket!=='inbox').slice(0,1);
  if(state.widgetMode==='inbox') return state.tasks.filter(t=>t.bucket==='inbox').slice(0,5);
  if(state.widgetMode==='min') return state.tasks.filter(t=>t.bucket!=='inbox').slice(0,1);
  return state.tasks.filter(t=>t.bucket!=='inbox').slice(0,5);
}
function widgetInner(){
  const items = widgetItems();
  const title = {today:'今日', next:'下一条', inbox:'收件箱', min:'今日'}[state.widgetMode];
  const rows = items.map(t=>`<div class="w-item">
      <div class="check" onclick="complete(${t.id})">✓</div>
      <div class="wt">${esc(t.title)}</div>
      <div class="when ${t.bucket==='overdue'?'warn':''}">${t.bucket==='overdue'?'逾期':(t.when.split(' ').pop()||'')}</div>
    </div>`).join('');
  const empty = items.length?'':'<div style="padding:8px 10px 12px;color:#b3ac9d;font-size:12px">台面干净了。说一句？</div>';
  const head = state.widgetMode==='min'
    ? `<div class="w-head"><b>${items.length}</b><span>件</span><span class="n">hover 展开</span></div>`
    : `<div class="w-head"><b>${title}</b><span>·</span><span>${items.length} 件</span><span class="n">${state.done.length} 已完成</span></div>`;
  return `${head}<div class="w-list">${rows}${empty}</div>
    <button class="w-add" onclick="openCapture()">${I.mic} 说一句</button>
    <div class="w-foot"><span>点击完成</span><span>拖动移动</span></div>`;
}
function renderWidgetSettings(){
  const seg = document.getElementById('modeSeg');
  const modes=[['today','今日'],['next','下一条'],['inbox','收件箱'],['min','极简']];
  if(seg) seg.innerHTML = modes.map(([k,l])=>`<button class="${state.widgetMode===k?'on':''}" onclick="state.widgetMode='${k}';render()">${l}</button>`).join('');
}
function go(v){ state.view = v; render(); document.getElementById('view').scrollTop=0; }

/* ---------------- 交互 ---------------- */
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function complete(id){
  const el = document.getElementById('task-'+id);
  const idx = state.tasks.findIndex(t=>t.id===id);
  if(idx<0) return;
  const t = state.tasks.splice(idx,1)[0];
  if(el){ el.classList.add('done'); }
  state.done.unshift({id:t.id, title:t.title, at:'刚刚'});
  setTimeout(()=>{ render(); toast('完成 · 今天已完成 '+state.done.length+' 项', '撤销', ()=>undo(t)); }, 260);
}
function undo(t){
  state.done = state.done.filter(d=>d.id!==t.id);
  state.tasks.push(t);
  render(); toast('已撤销');
}
function restore(id){
  const d = state.done.findIndex(x=>x.id===id);
  if(d<0) return;
  const [it]=state.done.splice(d,1);
  state.tasks.push({id:it.id,title:it.title,when:'',bucket:'inbox',done:false,review:false});
  render(); toast('已恢复到收件箱');
}
function plan(id, when){
  const t = state.tasks.find(x=>x.id===id);
  if(!t) return;
  t.bucket = when==='tomorrow' ? 'today' : 'today';
  t.when = when==='tomorrow' ? '明天 09:00' : '今天';
  t.review = false;
  render();
}
function tog(el){ el.classList.toggle('on'); }
function setOpacity(v){ document.querySelectorAll('.widget').forEach(w=>w.style.opacity=(v/100)); }

/* ---------------- 捕捉 ---------------- */
function openCapture(){
  document.getElementById('captureMask').classList.add('show');
  const i = document.getElementById('capInput'); i.value=''; i.focus();
}
function closeCapture(){ document.getElementById('captureMask').classList.remove('show'); }
function submitCapture(){
  const input = document.getElementById('capInput');
  const text = input.value.trim();
  if(!text){ toast('说点什么，或者打几个字'); return; }
  closeCapture();
  // 1. 乐观创建草稿
  const draft = {id:++idc, title:text, when:'', bucket:'inbox', done:false, review:true, draft:true};
  state.tasks.unshift(draft);
  if(state.view==='inbox'||state.view==='today'||state.view==='all') render();
  toast('已记录 ✓ 正在理解…');
  // 2. 模拟本地 AI 原地升级
  setTimeout(()=>{
    const i = state.tasks.findIndex(t=>t.id===draft.id);
    if(i<0) return;
    state.tasks.splice(i,1);
    if(/牛奶/.test(text)){
      state.tasks.unshift({id:++idc, title:'与张总开会', when:'明天 15:00', bucket:'today', done:false, review:false});
      state.tasks.push({id:++idc, title:'买牛奶', when:'', bucket:'inbox', done:false, review:true});
      render();
      toast('已安排：明天 15:00 与张总开会 · 另有 1 项待安排', '查看', ()=>go('inbox'));
    }else{
      state.tasks.unshift({id:++idc, title:text, when:'今天', bucket:'today', done:false, review:false});
      render(); toast('已安排到今天');
    }
  }, 1600);
}

/* ---------------- toast ---------------- */
let toastTimer=null, toastAction=null;
function toast(msg, btn, fn){
  const el = document.getElementById('toast');
  document.getElementById('toastText').innerHTML = msg;
  const b = document.getElementById('toastBtn');
  if(btn){ b.style.display=''; b.textContent=btn; toastAction=fn; } else { b.style.display='none'; toastAction=null; }
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), btn?5000:2600);
}
document.getElementById('toastBtn').onclick = ()=>{ if(toastAction) toastAction(); document.getElementById('toast').classList.remove('show'); };

/* ---------------- 启动 ---------------- */
render();
</script>
</body>
