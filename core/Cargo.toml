[package]
name = "clarify-core"
version = "0.1.0"
edition = "2021"
description = "Clarify domain core: events, repeat, count, SQLite store"

[dependencies]
chrono = { version = "0.4", features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v7", "v4"] }
thiserror = "2"
