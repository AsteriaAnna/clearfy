edition: 3.0.0
name: clarify-gateway
access: default

resources:
  clarify-gateway:
    component: fc3
    props:
      region: cn-hangzhou
      functionName: clarify-gateway
      runtime: nodejs20
      handler: index.handler
      code: ./
      memorySize: 256
      cpu: 0.25
      diskSize: 512
      timeout: 60
      internetAccess: true
      environmentVariables:
        DEEPSEEK_API_KEY: ${env(DEEPSEEK_API_KEY)}
        DOUBAO_API_KEY: ${env(DOUBAO_API_KEY)}
        ACTIVATION_SECRET: ${env(ACTIVATION_SECRET)}
        QUOTA_MODE: client
        FREE_PARSE_PER_DAY: '5'
        FREE_VOICE_SECONDS_PER_DAY: '30'
      triggers:
        - triggerName: http
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods:
              - GET
              - POST
